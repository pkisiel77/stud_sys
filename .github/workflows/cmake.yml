name: CMake Linux and macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.lang }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        lang: [PL, EN]
        exclude:
          - os: macos-latest
            compiler: gcc

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ncurses
          echo "CMAKE_PREFIX_PATH=$(brew --prefix ncurses)" >> "$GITHUB_ENV"

      - name: Install pyte (UI smoke test)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyte

      - name: Configure
        run: >-
          cmake -S . -B build
          -DSTUDSYS_UI_TESTS=ON
          "-DPython3_EXECUTABLE=$RUNNER_TEMP/venv/bin/python"
          -DSTUDSYS_LANG=${{ matrix.lang }}
          -DSTUDSYS_MQTT=OFF
          -DSTUDSYS_WERROR=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  mqtt:
    name: ubuntu-latest / ${{ matrix.compiler }} / MQTT
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev libpaho-mqtt-dev

      - name: Install pyte (UI smoke test)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyte

      - name: Configure
        run: >-
          cmake -S . -B build
          -DSTUDSYS_UI_TESTS=ON
          "-DPython3_EXECUTABLE=$RUNNER_TEMP/venv/bin/python"
          -DSTUDSYS_MQTT=ON
          -DSTUDSYS_WERROR=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build with make MQTT=1
        run: make MQTT=1 CC=${{ matrix.compiler }}

  sanitizers:
    name: ubuntu-latest / clang / ASan+UBSan
    runs-on: ubuntu-latest

    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Install pyte (UI smoke test)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyte

      - name: Configure
        run: >-
          cmake -S . -B build
          -DSTUDSYS_UI_TESTS=ON
          "-DPython3_EXECUTABLE=$RUNNER_TEMP/venv/bin/python"
          -DSTUDSYS_MQTT=OFF
          -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
